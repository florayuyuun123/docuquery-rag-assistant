# .github/workflows/deploy.yml
#
# CD pipeline — triggers on every push to main.
#
# What this does on EVERY push:
#   1. CI gate        lint + tests + frontend build (fail fast)
#   2. Connect        wire Amplify <-> GitHub once (idempotent — skipped if already connected)
#   3. CDK deploy     update Lambda/IAM/infra if changed (idempotent — no-op if nothing changed)
#   4. Amplify build  Amplify builds & deploys the frontend automatically via its webhook
#
# After the first successful run, step 2 is a no-op (already connected) and
# Amplify handles step 4 natively on every push — GitHub Actions just monitors it.
#
# Required GitHub secrets (Settings -> Secrets -> Actions):
#   AWS_ACCESS_KEY_ID       IAM access key for flotech-demo-account
#   AWS_SECRET_ACCESS_KEY   Matching secret key
#   AWS_ACCOUNT_ID          800445863339
#   GH_PAT              GitHub Personal Access Token (classic, repo scope)
#                           Create at: https://github.com/settings/tokens
#                           Needed once to connect Amplify to the GitHub repo.
#
# Optional GitHub variables (Settings -> Variables -> Actions):
#   ENVIRONMENT   dev        (default)
#   AWS_REGION    us-east-1  (default)

name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION:    "20"
  AWS_REGION:      ${{ vars.AWS_REGION || 'us-east-1' }}
  ENVIRONMENT:     ${{ vars.ENVIRONMENT || 'dev' }}
  AMPLIFY_APP_ID:  d3m1ddehppkb04
  REPO_URL:        https://github.com/florayuyuun123/docuquery-rag-assistant
  BRANCH:          main

jobs:
  # ── 1. CI gate ─────────────────────────────────────────────────────────────
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=shared

      - name: Lint
        run: npm run lint

      - name: Backend tests
        run: npm test --workspace=backend

      - name: CDK tests
        run: npm test --workspace=infra

      - name: Frontend typecheck + build
        run: |
          npm run typecheck --workspace=frontend
          npm run build --workspace=frontend
        env:
          VITE_USER_POOL_ID:          us-east-1_placeholder
          VITE_USER_POOL_CLIENT_ID:   placeholder
          VITE_IDENTITY_POOL_ID:      us-east-1:placeholder
          VITE_API_URL:               https://placeholder.execute-api.us-east-1.amazonaws.com/dev/
          VITE_DOCUMENT_BUCKET_NAME:  placeholder-bucket

  # ── 2. Connect Amplify to GitHub (idempotent) ──────────────────────────────
  # Requires the GH_PAT secret to be set (Settings -> Secrets -> Actions).
  # If the secret is missing the step is skipped gracefully — the rest of the
  # pipeline (CDK deploy, Amplify monitor) continues unaffected.
  connect-amplify:
    name: Connect Amplify to GitHub
    runs-on: ubuntu-latest
    needs: ci
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Wire GitHub repo to Amplify app (idempotent)
        run: |
          # Skip entirely if GH_PAT secret is not configured yet.
          # Add it at: Settings -> Secrets and variables -> Actions -> GH_PAT
          if [ -z "$GH_PAT" ]; then
            echo "GH_PAT secret is not set — skipping Amplify GitHub connection."
            echo "To enable automatic frontend deploys, add a GitHub PAT (classic, repo scope)"
            echo "as a repository secret named GH_PAT."
            exit 0
          fi

          # Check if repo is already connected
          CURRENT_REPO=$(aws amplify get-app \
            --app-id "$AMPLIFY_APP_ID" \
            --query 'app.repository' --output text)

          if [ "$CURRENT_REPO" = "$REPO_URL" ]; then
            echo "Amplify already connected to $REPO_URL — skipping."
          else
            echo "Connecting Amplify to $REPO_URL ..."
            aws amplify update-app \
              --app-id "$AMPLIFY_APP_ID" \
              --repository "$REPO_URL" \
              --access-token "$GH_PAT" \
              --enable-branch-auto-build \
              --enable-branch-auto-deletion
            echo "Amplify app updated."
          fi

      - name: Create/verify main branch in Amplify (idempotent)
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "GH_PAT not set — skipping branch creation."
            exit 0
          fi

          BRANCH_EXISTS=$(aws amplify list-branches \
            --app-id "$AMPLIFY_APP_ID" \
            --query "branches[?branchName=='$BRANCH'].branchName" \
            --output text)

          if [ -n "$BRANCH_EXISTS" ]; then
            echo "Branch '$BRANCH' already connected — skipping."
          else
            echo "Creating branch '$BRANCH' in Amplify..."
            aws amplify create-branch \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$BRANCH" \
              --enable-auto-build \
              --framework "React" \
              --stage PRODUCTION
            echo "Branch created."
          fi

  # ── 3. CDK deploy (infra changes only) ────────────────────────────────────
  deploy-infra:
    name: CDK Deploy
    runs-on: ubuntu-latest
    needs: connect-amplify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=shared

      # KB ID is already known — no two-pass deploy needed since infra is live.
      # CDK detects no changes and completes in ~15 seconds when nothing changed.
      - name: CDK deploy
        working-directory: infra
        run: |
          npx cdk deploy \
            --require-approval never \
            --context environment=${{ env.ENVIRONMENT }} \
            --context awsRegion=${{ env.AWS_REGION }} \
            --context awsAccountId=${{ secrets.AWS_ACCOUNT_ID }} \
            --context knowledgeBaseId=LPLGCWRHOM \
            --context repoUrl=${{ env.REPO_URL }} \
            --context branch=${{ env.BRANCH }}

  # ── 4. Monitor Amplify build ───────────────────────────────────────────────
  # After connect-amplify wires the repo, Amplify triggers its own build
  # automatically on every push via GitHub webhook. This job just monitors it.
  monitor-amplify:
    name: Monitor Amplify Build
    runs-on: ubuntu-latest
    needs: [connect-amplify, deploy-infra]
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Wait for Amplify build to complete
        run: |
          echo "Waiting for Amplify to start a build for commit $GITHUB_SHA ..."
          sleep 30  # give Amplify time to pick up the push webhook

          # Find the latest job for the branch
          for attempt in $(seq 1 3); do
            JOB_ID=$(aws amplify list-jobs \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$BRANCH" \
              --max-results 1 \
              --query 'jobSummaries[0].jobId' \
              --output text 2>/dev/null || echo "")
            if [ -n "$JOB_ID" ] && [ "$JOB_ID" != "None" ]; then
              break
            fi
            echo "No job yet, waiting 20s..."
            sleep 20
          done

          if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "None" ]; then
            echo "No Amplify build found — triggering manually..."
            JOB_ID=$(aws amplify start-job \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$BRANCH" \
              --job-type RELEASE \
              --query 'jobSummary.jobId' \
              --output text)
            echo "Started job: $JOB_ID"
          else
            echo "Found Amplify job: $JOB_ID"
          fi

          # Poll until SUCCEED or FAILED (max 15 min)
          for i in $(seq 1 45); do
            STATUS=$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$BRANCH" \
              --job-id "$JOB_ID" \
              --query 'job.summary.status' \
              --output text)
            echo "  [$i/45] Amplify status: $STATUS"
            case "$STATUS" in
              SUCCEED)
                APP_URL=$(aws amplify get-branch \
                  --app-id "$AMPLIFY_APP_ID" \
                  --branch-name "$BRANCH" \
                  --query 'branch.displayName' \
                  --output text 2>/dev/null || echo "")
                echo "Amplify build succeeded."
                echo "App URL: https://${BRANCH}.${AMPLIFY_APP_ID}.amplifyapp.com"
                exit 0 ;;
              FAILED|CANCELLED)
                echo "Amplify build $STATUS."
                exit 1 ;;
            esac
            sleep 20
          done
          echo "Amplify build timed out."
          exit 1
